name: Deploy FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bust cache for main script
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          sed -E -i "s|/assets/js/site.min.js\?v=[A-Za-z0-9._-]+|/assets/js/site.min.js?v=${SHORT_SHA}|g" index.html

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_TARGET_DIR }}
